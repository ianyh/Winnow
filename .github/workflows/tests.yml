name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build and run unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: |
          set -o pipefail && xcodebuild -project Winnow.xcodeproj/ -scheme Winnow clean test | xcbeautify

